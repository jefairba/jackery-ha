name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Issues and topics are only required to join the HACS default
          # store. This personal fork is installed as a custom repository
          # and keeps issues off on purpose.
          ignore: "issues topics"
